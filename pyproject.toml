[project]
name = "rag4prefa"
version = "0.1.0"
description = "RAG4Prefa — 工程课题文档知识库问答（Milvus + 混合检索 + 真流式）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-docx>=1.1",
    "python-multipart>=0.0.12",
    "openai>=1.54",
    "httpx>=0.27",
    "tenacity>=9",
    "jieba>=0.42",
    "structlog>=24",
    "numpy>=2.0",
]

[project.optional-dependencies]
milvus = ["pymilvus>=2.5"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]

[project.scripts]
rag4prefa = "rag4prefa.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag4prefa"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
