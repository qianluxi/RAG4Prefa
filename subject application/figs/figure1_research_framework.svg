<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="160mm" height="99.56mm" viewBox="0 0 1800 1120">
<defs>
  <marker id="arrowNavy" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#36566D"/></marker>
  <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2A8C82"/></marker>
  <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8A9AA5"/></marker>
  <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#17324D" flood-opacity="0.08"/></filter>
  <style>
    text { font-family: 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif; fill:#20394B; }
    .title { font-size:34px; font-weight:700; letter-spacing:1px; }
    .subtitle { font-size:17px; fill:#657987; }
    .panelTitle { font-size:22px; font-weight:700; }
    .cardTitle { font-size:18px; font-weight:700; }
    .miniTitle { font-size:16px; font-weight:700; }
    .supportTitle { font-size:15px; font-weight:700; }
    .body { font-size:16px; fill:#435968; }
    .small { font-size:14px; fill:#667B88; }
    .tiny { font-size:13px; fill:#6F828D; }
    .white { fill:#FFFFFF; }
    .num { font-size:17px; font-weight:700; fill:#FFFFFF; }
  </style>
</defs>
<rect width="1800" height="1120" fill="#FFFFFF"/>

<text x="60" y="57" class="title" text-anchor="start">项目总体研究框架</text>
<text x="62" y="91" class="subtitle" text-anchor="start">面向公众的装配式内装知识服务与交互智能体关键技术研究</text>
<line x1="60" y1="116" x2="1740" y2="116" stroke="#E6EDF1" stroke-width="2"/>
<rect x="55" y="150" width="330" height="610" rx="18" fill="#F7FAFC" stroke="#DCE6EB" stroke-width="1.5" filter="url(#softShadow)"/>
<rect x="55" y="150" width="330" height="62" rx="18" fill="#EAF1F5" stroke="#EAF1F5" stroke-width="0"/>
<text x="80" y="190" class="panelTitle" text-anchor="start">现实需求与关键瓶颈</text>
<rect x="78" y="235" width="284" height="142" rx="13" fill="#FFFFFF" stroke="#DFE8ED" stroke-width="1.2"/>
<circle cx="108" cy="271" r="18" fill="#477B9B"/>
<text x="108" y="277" class="num" text-anchor="middle">01</text>
<text x="140" y="278" class="cardTitle" text-anchor="start">语言落差</text>
<text x="98" y="318" class="body" text-anchor="start">
<tspan x="98" dy="0">专业术语、标准条文难以</tspan>
<tspan x="98" dy="27">转化为居民听得懂的表达。</tspan>
</text>
<rect x="78" y="393" width="284" height="142" rx="13" fill="#FFFFFF" stroke="#DFE8ED" stroke-width="1.2"/>
<circle cx="108" cy="429" r="18" fill="#477B9B"/>
<text x="108" y="435" class="num" text-anchor="middle">02</text>
<text x="140" y="436" class="cardTitle" text-anchor="start">适用性落差</text>
<text x="98" y="476" class="body" text-anchor="start">
<tspan x="98" dy="0">地域、时间、房屋类型与</tspan>
<tspan x="98" dy="27">改造条件影响政策和标准适用。</tspan>
</text>
<rect x="78" y="551" width="284" height="142" rx="13" fill="#FFFFFF" stroke="#DFE8ED" stroke-width="1.2"/>
<circle cx="108" cy="587" r="18" fill="#477B9B"/>
<text x="108" y="593" class="num" text-anchor="middle">03</text>
<text x="140" y="594" class="cardTitle" text-anchor="start">可信度落差</text>
<text x="98" y="634" class="body" text-anchor="start">
<tspan x="98" dy="0">检索到相关内容不等于</tspan>
<tspan x="98" dy="27">证据充分，生成答案可能失真。</tspan>
</text>
<rect x="425" y="150" width="925" height="610" rx="18" fill="#FBFDFE" stroke="#D6E3E9" stroke-width="1.5" filter="url(#softShadow)"/>
<rect x="425" y="150" width="925" height="62" rx="18" fill="#EAF4F3" stroke="#EAF4F3" stroke-width="0"/>
<text x="452" y="190" class="panelTitle" text-anchor="start">课题总体目标与四项核心研究</text>
<rect x="455" y="232" width="865" height="82" rx="14" fill="#254E68" stroke="#254E68" stroke-width="0"/>
<text x="887" y="266" class="white" text-anchor="middle" font-weight="700">构建“可理解、可交互、可信赖”的装配式内装公众知识服务系统</text>
<text x="887" y="292" class="white" text-anchor="middle">形成多源知识治理、语义转换、可信判断与多轮交互相融合的方法体系</text>
<rect x="455" y="338" width="420" height="180" rx="13" fill="#FFFFFF" stroke="#D9E5EA" stroke-width="1.4"/>
<circle cx="486" cy="372" r="17" fill="#2A8C82"/>
<text x="486" y="378" class="num" text-anchor="middle">01</text>
<text x="515" y="378" class="cardTitle" text-anchor="start">多源知识结构化治理与时空适用性管理</text>
<line x1="477" y1="399" x2="853" y2="399" stroke="#E7EEF1" stroke-width="1.3"/>
<text x="479" y="433" class="body" text-anchor="start">
<tspan x="479" dy="0">建立标准、政策、案例等多源知识元数据体系</tspan>
<tspan x="479" dy="30">判定地域、时间、对象、版本及来源权威性</tspan>
</text>
<rect x="900" y="338" width="420" height="180" rx="13" fill="#FFFFFF" stroke="#D9E5EA" stroke-width="1.4"/>
<circle cx="931" cy="372" r="17" fill="#2A8C82"/>
<text x="931" y="378" class="num" text-anchor="middle">02</text>
<text x="960" y="378" class="cardTitle" text-anchor="start">公众生活语言与专业术语双向语义转换</text>
<line x1="922" y1="399" x2="1298" y2="399" stroke="#E7EEF1" stroke-width="1.3"/>
<text x="924" y="433" class="body" text-anchor="start">
<tspan x="924" dy="0">识别咨询意图，归一口语表达并抽取关键条件</tspan>
<tspan x="924" dy="30">将规范条文转化为通俗表达，保证语义不失真</tspan>
</text>
<rect x="455" y="542" width="420" height="180" rx="13" fill="#FFFFFF" stroke="#D9E5EA" stroke-width="1.4"/>
<circle cx="486" cy="576" r="17" fill="#2A8C82"/>
<text x="486" y="582" class="num" text-anchor="middle">03</text>
<text x="515" y="582" class="cardTitle" text-anchor="start">证据约束下的适用性判断与可信拒答</text>
<line x1="477" y1="603" x2="853" y2="603" stroke="#E7EEF1" stroke-width="1.3"/>
<text x="479" y="637" class="body" text-anchor="start">
<tspan x="479" dy="0">分层判断依据存在性、适用性与证据充分性</tspan>
<tspan x="479" dy="30">形成有据回答、证据不足提示与无据拒答机制</tspan>
</text>
<rect x="900" y="542" width="420" height="180" rx="13" fill="#FFFFFF" stroke="#D9E5EA" stroke-width="1.4"/>
<circle cx="931" cy="576" r="17" fill="#2A8C82"/>
<text x="931" y="582" class="num" text-anchor="middle">04</text>
<text x="960" y="582" class="cardTitle" text-anchor="start">面向公众的多轮交互智能体与效果评价</text>
<line x1="922" y1="603" x2="1298" y2="603" stroke="#E7EEF1" stroke-width="1.3"/>
<text x="924" y="637" class="body" text-anchor="start">
<tspan x="924" dy="0">实现上下文保持、主动澄清、任务引导与工具调用</tspan>
<tspan x="924" dy="30">通过理解度、任务完成率和满意度验证服务效果</tspan>
</text>
<line x1="388" y1="450" x2="416" y2="450" stroke="#8A9AA5" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowGray)"/>
<line x1="1353" y1="450" x2="1380" y2="450" stroke="#8A9AA5" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowGray)"/>
<rect x="1390" y="150" width="355" height="610" rx="18" fill="#F7FAFC" stroke="#DCE6EB" stroke-width="1.5" filter="url(#softShadow)"/>
<rect x="1390" y="150" width="355" height="62" rx="18" fill="#EAF1F5" stroke="#EAF1F5" stroke-width="0"/>
<text x="1417" y="190" class="panelTitle" text-anchor="start">预期成果与应用</text>
<rect x="1415" y="235" width="305" height="112" rx="13" fill="#FFFFFF" stroke="#DFE8ED" stroke-width="1.2"/>
<rect x="1432" y="263" width="38" height="38" rx="10" fill="#DDEDEA" stroke="#DDEDEA" stroke-width="0"/>
<text x="1451" y="289" class="cardTitle" text-anchor="middle" fill="#2A8179">A</text>
<text x="1485" y="278" class="cardTitle" text-anchor="start">装配式内装公众知识库</text>
<text x="1485" y="310" class="small" text-anchor="start">多源、结构化、可追溯、可更新</text>
<rect x="1415" y="363" width="305" height="112" rx="13" fill="#FFFFFF" stroke="#DFE8ED" stroke-width="1.2"/>
<rect x="1432" y="391" width="38" height="38" rx="10" fill="#DDEDEA" stroke="#DDEDEA" stroke-width="0"/>
<text x="1451" y="417" class="cardTitle" text-anchor="middle" fill="#2A8179">B</text>
<text x="1485" y="406" class="cardTitle" text-anchor="start">公众交互智能体原型</text>
<text x="1485" y="438" class="small" text-anchor="start">支持多轮咨询、主动澄清与可信回答</text>
<rect x="1415" y="491" width="305" height="112" rx="13" fill="#FFFFFF" stroke="#DFE8ED" stroke-width="1.2"/>
<rect x="1432" y="519" width="38" height="38" rx="10" fill="#DDEDEA" stroke="#DDEDEA" stroke-width="0"/>
<text x="1451" y="545" class="cardTitle" text-anchor="middle" fill="#2A8179">C</text>
<text x="1485" y="534" class="cardTitle" text-anchor="start">知识服务与评测方法</text>
<text x="1485" y="566" class="small" text-anchor="start">形成可复现的指标、题集和评价规范</text>
<rect x="1415" y="619" width="305" height="112" rx="13" fill="#FFFFFF" stroke="#DFE8ED" stroke-width="1.2"/>
<rect x="1432" y="647" width="38" height="38" rx="10" fill="#DDEDEA" stroke="#DDEDEA" stroke-width="0"/>
<text x="1451" y="673" class="cardTitle" text-anchor="middle" fill="#2A8179">D</text>
<text x="1485" y="662" class="cardTitle" text-anchor="start">试点应用与研究成果</text>
<text x="1485" y="694" class="small" text-anchor="start">用户评价、研究报告及相关软件成果</text>
<rect x="55" y="795" width="520" height="238" rx="16" fill="#F5F8FA" stroke="#D8E2E8" stroke-width="1.4"/>
<text x="82" y="835" class="panelTitle" text-anchor="start">前期工程基础（已完成）</text>
<text x="82" y="868" class="small" text-anchor="start">为本课题提供可复用的工程底座</text>
<rect x="80" y="895" width="150" height="108" rx="10" fill="#FFFFFF" stroke="#DFE8ED" stroke-width="1.0"/>
<text x="92" y="929" class="miniTitle" text-anchor="start">
<tspan x="92" dy="0">文档解析与入库</tspan>
</text>
<text x="92" y="961" class="tiny" text-anchor="start">
<tspan x="92" dy="0">多格式解析</tspan>
<tspan x="92" dy="20">章节识别</tspan>
<tspan x="92" dy="20">OCR</tspan>
</text>
<rect x="242" y="895" width="150" height="108" rx="10" fill="#FFFFFF" stroke="#DFE8ED" stroke-width="1.0"/>
<text x="254" y="929" class="miniTitle" text-anchor="start">
<tspan x="254" dy="0">检索与答案生成</tspan>
</text>
<text x="254" y="961" class="tiny" text-anchor="start">
<tspan x="254" dy="0">混合检索</tspan>
<tspan x="254" dy="20">重排</tspan>
<tspan x="254" dy="20">引用生成</tspan>
</text>
<rect x="404" y="895" width="150" height="108" rx="10" fill="#FFFFFF" stroke="#DFE8ED" stroke-width="1.0"/>
<text x="416" y="929" class="miniTitle" text-anchor="start">
<tspan x="416" dy="0">评测与系统运行</tspan>
</text>
<text x="416" y="961" class="tiny" text-anchor="start">
<tspan x="416" dy="0">可复现评测</tspan>
<tspan x="416" dy="20">Web/API</tspan>
<tspan x="416" dy="20">660项测试</tspan>
</text>
<rect x="600" y="795" width="785" height="238" rx="16" fill="#F5F8FA" stroke="#D8E2E8" stroke-width="1.4"/>
<text x="628" y="835" class="panelTitle" text-anchor="start">三项技术支撑</text>
<text x="628" y="868" class="small" text-anchor="start">保障核心研究可实现、可验证、可交付</text>
<rect x="625" y="895" width="232" height="108" rx="10" fill="#FFFFFF" stroke="#DFE8ED" stroke-width="1.0"/>
<circle cx="647" cy="918" r="13" fill="#547C93"/>
<text x="647" y="923" class="tiny" text-anchor="middle" fill="#FFFFFF" font-weight="700">01</text>
<text x="668" y="924" class="supportTitle" text-anchor="start">工程文档结构解析与切块</text>
<text x="641" y="958" class="tiny" text-anchor="start">
<tspan x="641" dy="0">章节树还原</tspan>
<tspan x="641" dy="20">OCR与结构化抽取</tspan>
</text>
<rect x="871" y="895" width="232" height="108" rx="10" fill="#FFFFFF" stroke="#DFE8ED" stroke-width="1.0"/>
<circle cx="893" cy="918" r="13" fill="#547C93"/>
<text x="893" y="923" class="tiny" text-anchor="middle" fill="#FFFFFF" font-weight="700">02</text>
<text x="914" y="924" class="supportTitle" text-anchor="start">混合检索与跨通道融合</text>
<text x="887" y="958" class="tiny" text-anchor="start">
<tspan x="887" dy="0">向量检索 + BM25</tspan>
<tspan x="887" dy="20">融合重排与候选优化</tspan>
</text>
<rect x="1117" y="895" width="232" height="108" rx="10" fill="#FFFFFF" stroke="#DFE8ED" stroke-width="1.0"/>
<circle cx="1139" cy="918" r="13" fill="#547C93"/>
<text x="1139" y="923" class="tiny" text-anchor="middle" fill="#FFFFFF" font-weight="700">03</text>
<text x="1160" y="924" class="supportTitle" text-anchor="start">评测体系与服务化交付</text>
<text x="1133" y="958" class="tiny" text-anchor="start">
<tspan x="1133" dy="0">指标评测与消融验证</tspan>
<tspan x="1133" dy="20">接口、权限与部署交付</tspan>
</text>
<rect x="1410" y="795" width="335" height="238" rx="16" fill="#F5F8FA" stroke="#D8E2E8" stroke-width="1.4"/>
<text x="1438" y="835" class="panelTitle" text-anchor="start">评测与反馈闭环</text>
<text x="1438" y="875" class="body" text-anchor="start">
<tspan x="1438" dy="0">检索与引用质量</tspan>
<tspan x="1438" dy="29">证据判断与拒答效果</tspan>
<tspan x="1438" dy="29">多轮任务完成与公众体验</tspan>
</text>
<line x1="1690" y1="977" x2="1690" y2="1005" stroke="#2A8C82" stroke-width="2" stroke-linecap="round" marker-end="url(#arrowTeal)"/>
<text x="1438" y="1015" class="tiny" text-anchor="start">评价结果反馈至知识、算法与交互策略</text>
<line x1="315" y1="785" x2="315" y2="770" stroke="#8A9AA5" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 6" marker-end="url(#arrowGray)"/>
<line x1="990" y1="785" x2="990" y2="770" stroke="#8A9AA5" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 6" marker-end="url(#arrowGray)"/>
<path d="M1410 918 C1370 918,1360 780,1310 765" fill="none" stroke="#2A8C82" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrowTeal)"/>
<text x="220" y="746" class="small" text-anchor="middle">现实问题牵引</text>
<text x="887" y="746" class="small" text-anchor="middle">核心研究形成服务能力</text>
<text x="1567" y="746" class="small" text-anchor="middle">成果转化与示范应用</text>
<line x1="60" y1="1060" x2="1740" y2="1060" stroke="#E6EDF1" stroke-width="1.5"/>
<text x="900" y="1092" class="small" text-anchor="middle">研究逻辑：问题牵引  →  核心技术研究  →  系统集成  →  公众试点验证  →  反馈优化</text>
